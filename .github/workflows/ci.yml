name: Build and Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc clang valgrind

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install gcc llvm valgrind --overwrite 2>/dev/null || true

    - name: Set up environment
      run: |
        CC=${{ matrix.compiler }}
        echo "CC=$CC" >> $GITHUB_ENV
        $CC --version

    - name: Build project
      run: make all

    - name: Run basic tests
      run: make test-basic

    - name: Run concurrent tests
      run: make test-concurrent
      timeout-minutes: 2

    - name: Memory check with valgrind
      run: |
        make debug
        valgrind --leak-check=summary --quick ./shm init || echo "Exit code: $?"
      continue-on-error: true

  static-analysis:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install clang-tools
      run: sudo apt-get update && sudo apt-get install -y clang-tools

    - name: Run static analysis with cppcheck
      run: |
        sudo apt-get install -y cppcheck
        cppcheck --enable=all --suppress=missingIncludeSystem --error-exitcode=1 *.h *.c 2>&1 | head -30
      continue-on-error: true
